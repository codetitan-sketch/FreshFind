<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="ffShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#013220" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#ffGrad)" />

  <!-- Inner Soft Glow Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Fresh Plant Sprout / Leaf Motif -->
  <g filter="url(#ffShadow)">
    <!-- Main stem -->
    <path d="M22 50 C24 40, 29 32, 38 20 C39 19, 41 20, 40 22 C33 34, 28 41, 26 50 Z" 
          fill="#ffffff" opacity="0.9" />

    <!-- Left Leaf -->
    <path d="M30 36 C24 37, 16 35, 13 27 C12 24, 15 23, 18 24 C24 26, 28 30, 31 35 Z" 
          fill="#ffffff" />
    <path d="M14 26 C20 28, 25 31, 30 36" 
          stroke="#059669" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Right Large Leaf -->
    <path d="M33 31 C37 25, 45 19, 51 17 C53 16, 54 19, 52 21 C47 27, 40 32, 34 33 Z" 
          fill="#ffffff" />
    <path d="M51 18 C46 23, 40 28, 34 32" 
          stroke="#059669" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Top Sprout Leaf -->
    <path d="M36 24 C36 17, 39 12, 42 10 C44 9, 45 11, 44 13 C42 17, 40 21, 38 25 Z" 
          fill="#d1fae5" />
  </g>
</svg>
