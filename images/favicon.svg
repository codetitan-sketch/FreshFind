<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mainLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="leftLeafGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="topLeafGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Main graceful stem -->
    <path d="M18 56 C21 44, 28 32, 38 18 C39.5 16, 42 17, 41 19 C31 34, 25 45, 23 56 Z" 
          fill="#047857" />

    <!-- Left Sprout Leaf -->
    <path d="M29 38 C21 39, 9 35, 7 24 C6 20, 11 19, 16 20 C24 23, 28 30, 31 37 Z" 
          fill="url(#leftLeafGrad)" />
    <!-- Left Leaf Vein -->
    <path d="M8 23 C15 25, 22 29, 29 37" 
          stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Right Bold Leaf -->
    <path d="M32 33 C37 26, 47 18, 56 16 C58.5 15.5, 59.5 19, 57 21.5 C50 29, 41 35, 33 36 Z" 
          fill="url(#mainLeafGrad)" />
    <!-- Right Leaf Vein -->
    <path d="M56 17 C48 24, 40 30, 33 35" 
          stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Center/Top Young Leaf -->
    <path d="M37 25 C37 17, 41 10, 44 7 C46.5 5.5, 47.5 8, 46.5 10.5 C44.5 15, 42 20, 39 26 Z" 
          fill="url(#topLeafGrad)" />
    <!-- Top Leaf Center Rib -->
    <path d="M44 8 C42 14, 40 19, 38 25" 
          stroke="#d1fae5" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>
</svg>
